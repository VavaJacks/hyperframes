<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Cinco Cenas</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Inter";
        src: url("assets/fonts/Inter-400-latin.woff2") format("woff2");
        font-weight: 400 500;
        font-style: normal;
      }
      @font-face {
        font-family: "Inter";
        src: url("assets/fonts/Inter-700-latin.woff2") format("woff2");
        font-weight: 600 700;
        font-style: normal;
      }
      body {
        margin: 0;
        background: #000;
        font-family: "Inter", sans-serif;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
      }
      .scene {
        position: absolute;
        inset: 0;
        overflow: hidden;
      }
      .cam {
        position: absolute;
        inset: 0;
      }
      .cam > svg,
      .full {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      .vignette {
        position: absolute;
        inset: 0;
        pointer-events: none;
        background: radial-gradient(
          ellipse at center,
          rgba(0, 0, 0, 0) 55%,
          rgba(0, 0, 0, 0.55) 100%
        );
      }
      #fade {
        position: absolute;
        inset: 0;
        background: #000;
        opacity: 1;
        pointer-events: none;
      }

      /* ---------- Cena 2: close-up do papel ---------- */
      #s2-close {
        position: absolute;
        inset: 0;
        opacity: 0;
        background:
          repeating-linear-gradient(92deg, rgba(0, 0, 0, 0.08) 0 3px, rgba(0, 0, 0, 0) 3px 38px),
          linear-gradient(160deg, #6b4429, #3e2615);
      }
      #s2-paper-wrap {
        position: absolute;
        left: 470px;
        top: 70px;
        width: 980px;
        height: 940px;
      }
      #s2-paper {
        position: absolute;
        inset: 0;
        background:
          repeating-linear-gradient(
            180deg,
            rgba(0, 0, 0, 0) 0 88px,
            rgba(70, 110, 160, 0.25) 88px 90px
          ),
          #f6f2e8;
        box-shadow: 0 40px 80px rgba(0, 0, 0, 0.55);
        border-radius: 4px;
        padding: 90px 90px 0 120px;
        box-sizing: border-box;
        color: #1b2a4a;
      }
      #s2-paper::before {
        content: "";
        position: absolute;
        left: 92px;
        top: 0;
        bottom: 0;
        width: 2px;
        background: rgba(200, 60, 60, 0.45);
      }
      .row {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        height: 90px;
        font-size: 52px;
        font-style: italic;
        clip-path: inset(0 100% 0 0);
      }
      .row .lbl {
        font-weight: 400;
      }
      .row .val {
        font-weight: 600;
        font-style: normal;
      }
      .row.neg .val {
        color: #a0262f;
      }
      #s2-rule {
        height: 90px;
        position: relative;
      }
      #s2-rule-line {
        position: absolute;
        left: 0;
        right: 0;
        top: 44px;
        height: 5px;
        background: #1b2a4a;
        transform-origin: left center;
      }
      .row.total {
        font-size: 64px;
      }
      #s2-circle {
        position: absolute;
        right: 40px;
        top: 516px;
        width: 400px;
        height: 150px;
        overflow: visible;
      }
      #s2-pen {
        position: absolute;
        left: 0;
        top: 0;
        width: 520px;
        height: 120px;
      }

      /* ---------- Cena 4: renda despencando ---------- */
      #s4 .cam {
        background: radial-gradient(ellipse at 50% 40%, #151a24, #07080c 75%);
      }
      #s4-red {
        position: absolute;
        inset: 0;
        background: radial-gradient(
          ellipse at 70% 60%,
          rgba(200, 20, 30, 0.55),
          rgba(0, 0, 0, 0) 70%
        );
        opacity: 0;
      }
      #s4-label {
        position: absolute;
        left: 160px;
        top: 96px;
        font-size: 30px;
        letter-spacing: 0.3em;
        font-weight: 600;
        color: #8a93a6;
      }
      #s4-value {
        position: absolute;
        left: 156px;
        top: 140px;
        font-size: 150px;
        font-weight: 700;
        color: #f2f4f8;
        letter-spacing: -0.02em;
        font-variant-numeric: tabular-nums;
      }
      #s4-badge {
        position: absolute;
        right: 160px;
        top: 150px;
        padding: 18px 34px;
        border-radius: 14px;
        background: #c4161c;
        color: #fff;
        font-size: 72px;
        font-weight: 700;
        opacity: 0;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-width="1920"
      data-height="1080"

      <!-- =========================================================

      <!-- =========================================================

      <section id="s2" class="scene clip" data-start="6" data-duration="6" data-track-index="0">
        <div class="cam" id="s2-cam">

                d="M520 600 L660 640"
                stroke="#ffd690"

              />
            </g>
            <!-- caneca -->
            <g>
              <rect x="640" y="800" width="70" height="82" rx="10" fill="#e8e3da" />
              <path d="M710 818 Q748 830 710 862" stroke="#e8e3da" stroke-width="10" fill="none" />
            </g>
            <!-- calculadora -->

              <rect x="1160" y="700" width="20" height="24" fill="#5b8fa8" />
              <!-- pescoço e cabeça -->
              <rect x="1028" y="548" width="64" height="66" fill="#d09e7b" />
              <g id="s5-head">
                <ellipse cx="986" cy="500" rx="14" ry="22" fill="#d6a582" />
                <ellipse cx="1134" cy="500" rx="14" ry="22" fill="#d6a582" />
                <ellipse cx="1060" cy="494" rx="74" ry="86" fill="#e0b08c" />
                <path
                  d="M984 486 Q980 396 1060 392 Q1140 396 1136 486 Q1124 440 1060 436 Q996 440 984 486 Z"
                  fill="#9aa1a8"
                />
                <g fill="none" stroke="#2b3138" stroke-width="5">
                  <rect x="1006" y="482" width="44" height="30" rx="8" />
                  <rect x="1070" y="482" width="44" height="30" rx="8" />
                  <path d="M1050 494 H1070" />
                </g>
                <path
                  d="M1014 470 Q1028 462 1044 468"
                  stroke="#6b7076"
                  stroke-width="5"
                  fill="none"
                  stroke-linecap="round"
                />
                <path
                  d="M1076 468 Q1092 462 1106 470"
                  stroke="#6b7076"
                  stroke-width="5"
                  fill="none"
                  stroke-linecap="round"
                />
                <path
                  d="M1060 512 L1052 540 L1066 540"
                  stroke="#b7835f"
                  stroke-width="4"
                  fill="none"
                  stroke-linecap="round"
                />
                <path
                  d="M1040 560 Q1060 556 1080 560"
                  stroke="#8a5a44"
                  stroke-width="5"
                  fill="none"
                  stroke-linecap="round"
                />
              </g>
              <!-- prancheta segurada com as duas mãos -->
              <g id="s5-board">
                <path
                  d="M880 660 Q850 760 930 820"
                  stroke="#f4f7f8"
                  stroke-width="70"
                  fill="none"
                  stroke-linecap="round"
                />
                <path
                  d="M1240 660 Q1270 760 1190 820"
                  stroke="#f4f7f8"
                  stroke-width="70"
                  fill="none"
                  stroke-linecap="round"
                />
                <rect x="945" y="740" width="230" height="300" rx="10" fill="#7a5a3c" />
                <rect x="962" y="766" width="196" height="258" fill="#fbfbf8" />
                <rect
                  x="1020"
                  y="730"
                  width="80"
                  height="34"
                  rx="6"
                  fill="#b7c0c6"
                  stroke="#6f7a82"
                  stroke-width="3"
                />
                <text
                  x="1060"
                  y="806"
                  text-anchor="middle"
                  font-family="Inter"
                  font-weight="700"
                  font-size="17"
                  letter-spacing="2"
                  fill="#1d3557"
                >
                  DIAGNÓSTICO
                </text>
                <g stroke="#9aa9b2" stroke-width="4" stroke-linecap="round">
                  <path d="M980 834 H1140" />
                  <path d="M980 862 H1120" />
                  <path d="M980 890 H1140" />
                  <path d="M980 946 H1100" />
                  <path d="M980 974 H1130" />
                </g>
                <path
                  id="s5-mark"
                  d="M976 918 H1146"
                  stroke="#d0202b"
                  stroke-width="10"
                  stroke-linecap="round"
                />
                <ellipse cx="948" cy="850" rx="30" ry="40" fill="#e0b08c" />
                <ellipse cx="1172" cy="850" rx="30" ry="40" fill="#e0b08c" />
              </g>
            </g>

            <!-- paciente desfocado em primeiro plano -->
            <g filter="url(#s5-blur)" fill="#1b2128">
              <path d="M-40 1080 Q-20 860 160 820 Q300 800 420 860 Q500 920 520 1080 Z" />
              <ellipse cx="250" cy="720" rx="110" ry="130" />
            </g>
          </svg>
          <div
            class="full"
            style="
              background: linear-gradient(180deg, rgba(40, 90, 120, 0.18), rgba(10, 30, 50, 0.35));
            "
          ></div>
        </div>
        <div class="vignette"></div>
      </section>

      <div id="fade"></div>
    </div>

    <script>
      // ---------- elementos gerados (determinísticos) ----------
      function rng(seed) {
        let s = seed >>> 0;
        return () => {
          s = (s + 0x6d2b79f5) >>> 0;
          let t = s;
          t = Math.imul(t ^ (t >>> 15), t | 1);
          t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }
      const NS = "http://www.w3.org/2000/svg";
      function el(tag, attrs, parent) {
        const n = document.createElementNS(NS, tag);
        for (const k in attrs) n.setAttribute(k, attrs[k]);
        parent.appendChild(n);
        return n;
      }

      // estrelas (cena 1)
      const r1 = rng(7);
      const stars = document.getElementById("s1-stars");
      for (let i = 0; i < 70; i++) {
        el(
          "circle",
          {
            class: "s1-star",
            cx: (r1() * 1920).toFixed(1),
            cy: (r1() * 520).toFixed(1),
            r: (0.8 + r1() * 2).toFixed(2),
            fill: "#fff",
            opacity: "0",
          },
          stars,
        );
      }

      // cidade à noite (cena 2)
      const r2 = rng(11);
      const city = document.getElementById("s2-city");
      for (let i = 0; i < 9; i++) {
        const x = 120 + i * 64 + r2() * 10;
        const h = 140 + r2() * 260;
        el("rect", { x, y: 600 - h, width: 54, height: h, fill: "#16213a" }, city);
        for (let wy = 600 - h + 14; wy < 590; wy += 22) {
          for (let wx = x + 8; wx < x + 48; wx += 14) {
            if (r2() < 0.35)
              el(
                "rect",
                { x: wx, y: wy, width: 6, height: 9, fill: "#f7d488", opacity: 0.8 },
                city,
              );
          }
        }
      }
      const blinds = document.getElementById("s2-blinds");
      for (let y = 140; y < 600; y += 34) el("line", { x1: 110, y1: y, x2: 690, y2: y }, blinds);

      // livros (cena 2)
      const r3 = rng(23);
      const books = document.getElementById("s2-books");
      const bookColors = ["#7d1f2c", "#1d3557", "#2f5e2a", "#8a6a3a", "#4a4a52", "#a0522d"];
      [
        [110, 240],
        [252, 380],
        [392, 520],
        [532, 650],
      ].forEach(([top, bottom]) => {
        let x = 1374;
        while (x < 1780) {
          const w = 16 + r3() * 18;
          const h = (bottom - top) * (0.7 + r3() * 0.25);
          el(
            "rect",
            {
              x,
              y: bottom - h,
              width: w,
              height: h,
              fill: bookColors[Math.floor(r3() * bookColors.length)],
            },
            books,
          );
          x += w + 3;
        }
      });

      // janelas das alas (cena 3)
      const win = document.getElementById("s3-windows");
      [290, 1110].forEach((x0) => {
        for (let c = 0; c < 7; c++) {
          for (let r = 0; r < 2; r++) {
            const x = x0 + c * 78;
            const y = 500 + r * 120;
            el(
              "path",
              {
                d: `M${x} ${y + 76} V${y + 18} Q${x + 22} ${y} ${x + 44} ${y + 18} V${y + 76} Z`,
                fill: "#36506e",
              },
              win,
            );
            el(
              "path",
              {
                d: `M${x + 6} ${y + 70} V${y + 24} L${x + 18} ${y + 14} V${y + 70} Z`,
                fill: "#8fb3d6",
                opacity: 0.5,
              },
              win,
            );
          }
        }
      });

      // ---------- timeline ----------
      const tl = gsap.timeline({ paused: true });

      // transições: mergulho rápido no preto entre as cenas
      tl.to("#fade", { opacity: 0, duration: 0.6, ease: "power2.out" }, 0);
      [6, 12, 18, 24].forEach((t) => {
        tl.to("#fade", { opacity: 1, duration: 0.22, ease: "power2.in" }, t - 0.22);
        tl.to("#fade", { opacity: 0, duration: 0.35, ease: "power2.out" }, t);
      });
      tl.to("#fade", { opacity: 1, duration: 0.6, ease: "power2.in" }, 29.4);

      // CENA 1 — casa acendendo ao anoitecer, câmera aproxima
      tl.fromTo(
        "#s1-cam",
        { scale: 1.14, y: 30 },
        { scale: 1.0, y: 0, duration: 6, ease: "sine.out" },
        0,
      );
      tl.to(
        ".s1-star",
        { opacity: 0.85, duration: 1.2, stagger: { each: 0.02, from: "random" } },
        0.2,
      );
      tl.to(".s1-dim", { opacity: 0, duration: 0.9, stagger: 0.45, ease: "power2.out" }, 0.8);
      tl.to("#s1-halo", { opacity: 1, duration: 2.2 }, 1.0);
      tl.to("#s1-reflect", { opacity: 1, duration: 1.8 }, 1.2);
      tl.to("#s1-spots", { opacity: 1, duration: 0.6 }, 2.4);
      tl.to("#s1-garden", { opacity: 1, duration: 0.8 }, 2.8);
      tl.fromTo("#s1-ripples", { x: -30 }, { x: 30, duration: 6, ease: "none" }, 0);

      // CENA 2 — plano geral escrevendo, depois close no papel
      tl.fromTo(
        "#s2-cam",
        { scale: 1.0, x: 0, y: 0 },
        { scale: 1.12, x: -20, y: -60, duration: 3.4, ease: "sine.inOut" },
        6,
      );
      tl.fromTo(
        "#s2-hand",
        { x: -18, y: 0 },
        { x: 14, y: 4, duration: 0.32, ease: "sine.inOut", repeat: 9, yoyo: true },
        6.1,
      );
      tl.fromTo("#s2-head", { y: 0 }, { y: 6, duration: 1.6, ease: "sine.inOut" }, 6.2);
      tl.set("#s2-close", { opacity: 1 }, 9.2);
      tl.fromTo(
        "#s2-paper-wrap",
        { rotation: -6, scale: 1.08 },
        { rotation: -3, scale: 1.0, duration: 2.8, ease: "power2.out" },
        9.2,
      );
      const rows = gsap.utils.toArray("#s2-paper .row");
      const penY = [155, 245, 335, 425, 605];
      tl.set("#s2-pen", { x: 760, y: 60, rotation: -28, transformOrigin: "0% 50%" }, 9.2);
      rows.forEach((row, i) => {
        const t = 9.35 + i * 0.42 + (i === 4 ? 0.35 : 0);
        tl.to(row, { clipPath: "inset(0 0% 0 0)", duration: 0.38, ease: "none" }, t);
        tl.fromTo(
          "#s2-pen",
          { x: 590 },
          { x: 1400, y: penY[i], duration: 0.38, ease: "none", immediateRender: false },
          t,
        );
      });
      tl.fromTo(
        "#s2-rule-line",
        { scaleX: 0 },
        { scaleX: 1, duration: 0.3, ease: "power1.inOut" },
        11.03,
      );
      const circ = document.getElementById("s2-circle-path");
      const circLen = circ.getTotalLength();
      tl.fromTo(
        circ,
        { strokeDasharray: circLen, strokeDashoffset: circLen },
        { strokeDashoffset: 0, duration: 0.45, ease: "power1.inOut" },
        11.4,
      );
      tl.to("#s2-pen", { x: 1500, y: 700, duration: 0.45, ease: "power1.inOut" }, 11.4);

      // CENA 3 — câmera sobe revelando o colégio, alunos chegando
      tl.fromTo(
        "#s3-cam",
        { scale: 1.16, y: 120 },
        { scale: 1.0, y: 0, duration: 6, ease: "power2.out" },
        12,
      );
      tl.fromTo("#s3-cloud-a", { x: -40 }, { x: 60, duration: 6, ease: "none" }, 12);
      tl.fromTo("#s3-cloud-b", { x: 30 }, { x: -50, duration: 6, ease: "none" }, 12);
      tl.fromTo("#s3-cloud-c", { x: 0 }, { x: 70, duration: 6, ease: "none" }, 12);
      tl.fromTo(
        "#s3-birds",
        { x: -200, y: 40 },
        { x: 1700, y: -60, duration: 6, ease: "none" },
        12,
      );
      tl.fromTo(
        "#s3-flag-a",
        { skewY: 0 },
        {
          skewY: -4,
          duration: 0.6,
          ease: "sine.inOut",
          repeat: 9,
          yoyo: true,
          transformOrigin: "0% 50%",
        },
        12,
      );
      tl.fromTo(
        "#s3-flag-b",
        { skewY: 0 },
        {
          skewY: 4,
          duration: 0.7,
          ease: "sine.inOut",
          repeat: 7,
          yoyo: true,
          transformOrigin: "0% 50%",
        },
        12,
      );
      tl.fromTo(
        "#s3-minute",
        { rotation: 0 },
        { rotation: 30, duration: 6, ease: "none", svgOrigin: "960 214" },
        12,
      );
      [
        ["#s3-kid-1", 860, 1110, 930, 780, 0],
        ["#s3-kid-2", 1050, 1150, 990, 790, 0.4],
        ["#s3-kid-3", 980, 1220, 965, 800, 0.8],
      ].forEach(([id, x0, y0, x1, y1, d]) => {
        tl.fromTo(
          id,
          { x: x0, y: y0, scale: 1.5 },
          { x: x1, y: y1, scale: 0.55, duration: 5.6 - d, ease: "none" },
          12 + d,
        );
      });

      // CENA 4 — renda sobe e despenca
      tl.fromTo("#s4-cam", { scale: 1.04 }, { scale: 1.0, duration: 6, ease: "sine.out" }, 18);
      const up = document.getElementById("s4-line-up");
      const down = document.getElementById("s4-line-down");
      const upLen = up.getTotalLength();
      const downLen = down.getTotalLength();
      tl.fromTo(
        up,
        { strokeDasharray: upLen, strokeDashoffset: upLen },
        { strokeDashoffset: 0, duration: 2.2, ease: "power1.inOut" },
        18.3,
      );
      tl.fromTo(
        "#s4-reveal-rect",
        { attr: { width: 160 } },
        { attr: { width: 1080 }, duration: 2.2, ease: "power1.inOut" },
        18.3,
      );
      tl.to("#s4-peak", { opacity: 1, duration: 0.2 }, 20.4);
      tl.fromTo(
        down,
        { strokeDasharray: downLen, strokeDashoffset: downLen },
        { strokeDashoffset: 0, duration: 1.0, ease: "power3.in" },
        20.8,
      );
      tl.to("#s4-reveal-rect", { attr: { width: 1780 }, duration: 1.0, ease: "power3.in" }, 20.8);
      tl.to("#s4-peak", { fill: "#ff3b3b", duration: 0.2 }, 20.8);
      tl.to("#s4-red", { opacity: 1, duration: 0.5, ease: "power2.out" }, 21.6);
      tl.to("#s4-arrow", { opacity: 1, duration: 0.3 }, 21.7);
      tl.fromTo("#s4-arrow", { y: -60 }, { y: 0, duration: 0.5, ease: "back.out(2)" }, 21.7);
      tl.fromTo(
        "#s4-badge",
        { opacity: 0, scale: 1.6 },
        { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(2.2)" },
        21.9,
      );
      tl.to("#s4-value", { color: "#ff4a4a", duration: 0.3 }, 21.0);
      tl.to(
        "#s4-cam",
        {
          keyframes: [
            { x: -14, y: 8, duration: 0.05 },
            { x: 12, y: -10, duration: 0.05 },
            { x: -8, y: 6, duration: 0.05 },
            { x: 6, y: -4, duration: 0.05 },
            { x: 0, y: 0, duration: 0.06 },
          ],
        },
        21.75,
      );
      const money = { v: 12000 };
      const valueEl = document.getElementById("s4-value");
      const fmt = (v) =>
        "R$ " + String(Math.round(v / 100) * 100).replace(/\B(?=(\d{3})+(?!\d))/g, ".");
      const render = () => (valueEl.textContent = fmt(money.v));
      tl.fromTo(
        money,
        { v: 12000 },
        { v: 24800, duration: 2.2, ease: "power1.inOut", onUpdate: render },
        18.3,
      );
      tl.fromTo(
        money,
        { v: 24800 },
        { v: 4200, duration: 1.0, ease: "power3.in", onUpdate: render, immediateRender: false },
        20.8,
      );

      // CENA 5 — médico com a prancheta, foco no exame
      tl.fromTo(
        "#s5-cam",
        { scale: 1.0, x: 0, y: 0 },
        { scale: 1.12, x: -40, y: -30, duration: 6, ease: "sine.inOut" },
        24,
      );
      const ecg = document.getElementById("s5-ecg-hi");
      const ecgLen = ecg.getTotalLength();
      tl.fromTo(
        ecg,
        { strokeDasharray: `140 ${ecgLen}`, strokeDashoffset: 140 },
        { strokeDashoffset: -ecgLen, duration: 1.2, ease: "none", repeat: 4 },
        24,
      );
      tl.to("#s5-mass", { opacity: 1, duration: 0.8 }, 25.2);
      tl.fromTo(
        "#s5-ring",
        { opacity: 0, scale: 1.6 },
        { opacity: 1, scale: 1, duration: 0.5, ease: "power2.out", svgOrigin: "566 420" },
        25.4,
      );
      tl.to(
        "#s5-mass",
        { opacity: 0.55, duration: 0.6, ease: "sine.inOut", repeat: 5, yoyo: true },
        26.0,
      );
      tl.fromTo(
        "#s5-mark",
        { strokeDasharray: 180, strokeDashoffset: 180 },
        { strokeDashoffset: 0, duration: 0.5, ease: "power1.out" },
        25.8,
      );
      tl.fromTo(
        "#s5-head",
        { y: 8, rotation: 0 },
        { y: 0, rotation: -3, duration: 1.2, ease: "power2.inOut", svgOrigin: "1060 560" },
        27.0,
      );
      tl.fromTo("#s5-board", { y: 0 }, { y: 24, duration: 1.2, ease: "power2.inOut" }, 27.0);

      window.__timelines["main"] = tl;
    </script>
  </body>
